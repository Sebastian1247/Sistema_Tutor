# Tema de la interfaz: claro y sobrio, con un solo color de acento (azul)
# para que los botones principales (Entregar, Siguiente problema) destaquen.
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#1E293B"
borderColor = "#E2E8F0"
showWidgetBorder = true
baseRadius = "medium"
font = "sans-serif"
codeFont = "monospace"

[client]
toolbarMode = "minimal"                  # oculta opciones de desarrollador al estudiante
